name: Android CI (Debug)

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint, unit tests, and debug assemble
        run: |
          chmod +x ./gradlew
          ./gradlew clean lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dearmarcus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload nightly APK
        if: >-
          always() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: dearmarcus-nightly-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload lint and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dearmarcus-debug-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn

  publish-tagged-apk:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and derive package version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH; got '$TAG'."
            exit 1
          fi
          printf 'package_version=%s\n' "${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Assemble tagged debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload tagged APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dearmarcus-${{ github.ref_name }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Publish APK to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          ./gradlew publishReleaseApkPublicationToGitHubPackagesRepository \
            -PpackageVersion="$PACKAGE_VERSION"
          echo "Published com.dearmarcus:dear-marcus:$PACKAGE_VERSION to GitHub Packages."
